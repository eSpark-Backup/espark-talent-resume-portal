# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: eSpark Talent Resume Portal Main CI

on:
  push:
    branches: [ "main" ]

  workflow_dispatch:
    inputs:
      path_to_dockerfile:
        description: Path to the dockerfile (default = 'Dockerfile')
        default: "Dockerfile"
        type: string
      docker_build_dir:
        description: Docker build directory (default = '.')
        default: "."
        type: string
      image_tag:
        description: Tag to apply to images.
        type: string
        default: latest
      lifecycle_policy_file:
        description: Path to the lifecycle policy JSON file (default = 'policy.json')
        default: "policy.json"
        type: string
      backend_s3_bucket:
        description: Name of the S3bucket for Terraform backend
        default: "talent-terraform-bucket"
        type: string
      backend_iam_role:
        description: Name of the Terraform backend assumable IAM Role
        default: "terraform-role"
        type: string
      github_iam_role:
        description: Name of the IAM Role for adding access to ECR repo
        default: "cicd"
        type: string
      aws_account_id:
        description: AWS Account ID
        default: ${{ secrets.AWS_ACCOUNT_ID }}
        type: string
      aws_region:
        description: Target AWS Region
        default: "us-east-1"
        type: string
      backend_dynamodb_table:
        description: DynamoDB table for State lock
        default: "talent-terraform-dynamodb"
        type: string

# concurrency required to avoid terraform lock contention during ECR provisioning
concurrency: ci-${{ github.repository }}-docker-pipeline


jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      id-token: write
      contents: read
    
    outputs:
      image_tag: ${{ steps.build-publish.outputs.image_tag }}
      full_image: ${{ steps.build-publish.outputs.full_image }}
      
    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: configure aws credentials
      uses: aws-actions/configure-aws-credentials@v3
      with:
        role-to-assume: arn:aws:iam::${{ inputs.aws_account_id }}:role/cicd
        aws-region: ${{ inputs.aws_region }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_wrapper: false

    - name: prepare ECR repo name based on the Github repository
      shell: bash
      run: |
        set -eux
        
        # lowercase the name
        repo="${GITHUB_REPOSITORY,,}"
        
        # replace / with _
        echo "ECR_REPO_NAME=${repo//\//_}" >> $GITHUB_ENV

    - name: TF init
      shell: bash
      run: |
        set -eux
        terraform init -upgrade -reconfigure \
          -backend-config='skip_metadata_api_check=true' \
          -backend-config='skip_region_validation=true' \
          -backend-config='skip_credentials_validation=true' \
          -backend-config='region=${{ inputs.aws_region }}' \
          -backend-config='bucket=${{ inputs.backend_s3_bucket }}' \
          -backend-config='key=docker-ecr/terraform-${{ env.ECR_REPO_NAME }}.tfstate' \
          -backend-config='dynamodb_table=${{ inputs.backend_dynamodb_table }}' \
          -backend-config='role_arn=arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ inputs.backend_iam_role }}'
      working-directory: ${{ github.action_path }}
        
    - name: Create .env File
      run: |
        touch .env
        echo "B2_APPLICATION_KEY=${{secrets.B2_APPLICATION_KEY}}" >> .env
        echo "B2_APPLICATION_KEY_ID=${{secrets.B2_APPLICATION_KEY_ID}}" >> .env
        echo "BASE_URL=${{secrets.BASE_URL}}" >> .env
        echo "BUCKET_NAME=${{secrets.BUCKET_NAME}}" >> .env
        echo "END_POINT=${{secrets.END_POINT}}" >> .env
        echo "REGION=${{secrets.REGION}}" >> .env
        echo "NEXT_PUBLIC_SUPABASE_URL=${{secrets.NEXT_PUBLIC_SUPABASE_URL}}" >> .env
        echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${{secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY}}" >> .env

    - name: Create ECR repo [TF apply]
      shell: bash
      run: |
        set -eux
        terraform apply \
          -var 'repository_name=${{ env.ECR_REPO_NAME }}' \
          -var 'lifecycle_policy=${{ inputs.lifecycle_policy_file }}' \
          -var 'iam_role=arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ inputs.github_iam_role }}' \
          -var 'aws_account_id=${{ secrets.AWS_ACCOUNT_ID }}' \
          -auto-approve
      working-directory: ${{ github.action_path }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
      with:
        registries: ${{ inputs.aws_account_id }}
        mask-password: "true" # see: https://github.com/aws-actions/amazon-ecr-login#docker-credentials

    - name: Build, tag, and push image to Amazon ECR
      id: build-publish
      shell: bash
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: ${{ env.ECR_REPO_NAME }}
        IMAGE_TAG: ${{ inputs.image_tag }}
      run: |
        docker build "${{ inputs.docker_build_dir }}" -f "${{ inputs.path_to_dockerfile }}" -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
        docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
        echo "IMAGE $IMAGE_TAG is pushed to $ECR_REGISTRY/$ECR_REPOSITORY"
        echo "image_tag=$IMAGE_TAG" 
        echo "full_image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
