name: eSpark Talent Resume Portal Main CI

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    # strategy:
      # matrix:
        # node-version: [18.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/
    # env:
    #  B2_APPLICATION_KEY: ${{secrets.B2_APPLICATION_KEY}}
    #  B2_APPLICATION_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID }}
    #  BASE_URL: ${{ secrets.BASE_URL }}
    #  BUCKET_NAME: ${{ secrets.BUCKET_NAME }}
    #  END_POINT: ${{ secrets.END_POINT }}
    #  REGION: ${{ secrets.REGION }}

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Create .env File
      run: echo "B2_APPLICATION_KEY=${{secrets.B2_APPLICATION_KEY}}" >> .env &&
           echo "B2_APPLICATION_KEY_ID=${{secrets.B2_APPLICATION_KEY_ID}}" >> .env &&
           echo "BASE_URL=${{secrets.BASE_URL}}" >> .env &&
           echo "BUCKET_NAME=${{secrets.BUCKET_NAME}}" >> .env &&
           echo "END_POINT=${{secrets.END_POINT}}" >> .env &&
           echo "REGION=${{secrets.REGION}}" >> .env &&
           echo "NEXT_PUBLIC_SUPABASE_URL=${{secrets.NEXT_PUBLIC_SUPABASE_URL}}" >> .env &&
           echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${{secrets.NEXT_PUBLIC_SUPABASE_URL}}" >> .env 
    
    - name: Build Docker Image
      run: docker build --update -t faizi968/esparktalent-resumeportal .

    - name: Login to Docker Hub
      run: docker login -u ${{secrets.DOCKER_USERNAME}} -p ${{secrets.DOCKER_PASSWORD}}

    - name: Push Image to Docker Hub
      run: docker push faizi968/esparktalent-resumeportal:latest

  deploy:
    needs: build
    runs-on: portal-prod
    steps:
    - name: Pull Image from Docker Hub
      run: docker pull faizi968/esparktalent-resumeportal:latest

    - name: Delete old container
      run: docker rm -f esparktalent-resumeportal-container

    - name: Run Docker Container
      run: docker compose up -d --name esparktalent-resumeportal-container

